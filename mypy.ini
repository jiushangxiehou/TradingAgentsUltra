# Static type checking for the project-owned modules (D7 gate 2, ADR-009).
#
# Scope: src/ only. The pinned baseline and the LangChain-heavy call sites are
# intentionally excluded: typing them would require mass ignores and would
# report on code the project does not own. Imports of the baseline are treated
# as Any (follow_imports=silent), so the gate checks OUR boundary, not theirs.
#
# Run: .venv/Scripts/python -m mypy   (config is picked up from this file)

[mypy]
python_version = 3.11
files = src
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
warn_unused_ignores = False
warn_redundant_casts = True
no_error_summary = False
exclude = (?x)(
    ^src/integration/__main__\.py$
  )
