[pytest]
markers =
  offline: deterministic tests that do not call the live API
  live: tests that call the live LLM / data APIs
  unit: upstream unit tests (kept for the root-layout baseline)
  integration: upstream tests requiring external services; select explicitly
  smoke: upstream smoke tests
addopts = -ra --strict-markers
pythonpath = .
testpaths = test
filterwarnings =
  ignore::DeprecationWarning:deepeval