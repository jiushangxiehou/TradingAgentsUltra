    human_oversight: >
      Rejected current-book sizing (C) because it measures the existing book,
      not the proposed decision, and lets a new oversized Buy pass at
      size_pct=0; rejected rating-only NOT_EVALUATED as fail-open; required an
      explicit execution intent with every missing input rejected as
      MALFORMED_DECISION. Rejected per-analyst runtime trace attribution as
      unreliable under parallel analysts; required a run-level evidence set.
      Found and required fixes for a capture double-install leak, a silently
      dropped observation, a too-broad no-data marker that would relabel real
      reports, and a non-total trace catcher. Required a full scripted
      end-to-end run and a clean-tree strict baseline check; independently
      reran every gate.
    rationale: >
      The baseline has no numeric proposed size or current price, so the only
      honest gate input is the order the caller will execute: the AI rating is
      gated, the execution intent is declared, and a missing declaration is
      Hold. Run-level trace links are coarse but honest where runtime
      attribution is not; the ADR records the boundary and its reopen
      conditions. The vendor tree stays byte-identical at 213/213.
