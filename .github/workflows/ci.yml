# CS5351 CI/CD — Blocking Gates (D4/D7, ADR-009)
#
# Six gates, each a separate job, plus the baseline-integrity gate that ADR-008
# added. Every job is blocking: a red check on a pull request or push to a
# protected branch blocks the merge.
#
#   1. test-approval     the changed tests are approved in the BASE manifest
#   2. static-analysis   ruff + mypy + pip check
#      safety-paths      contract / security / API surface / permission checks
#   3. schema-gate       requirements.yaml validated against req-schema.json
#   4. semantic-eval     fixed eval set replayed (prompts + guardrail + models)
#   5. regression        offline suite + the full upstream suite
#   6. ai-use-log        code/prompt change requires docs/ai-use-log.yaml
#
# Branch protection (required checks + human review on safety paths) is
# documented in docs/architecture/branch-protection.md; it is a repository
# setting, not a workflow step.

name: CS5351 Blocking Gates

on:
  push:
    branches: ["main", "dev", "develop", "feature-c"]
  pull_request:
    branches: ["main", "dev", "develop", "feature-c"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  CI: "1"
  TRADINGAGENTS_NO_UPDATE_CHECK: "1"
  # Read by scripts/gate_test_approval.py and scripts/gate_ai_use_log.py.
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  GITHUB_BASE_REF: ${{ github.base_ref }}

jobs:
  schema-gate:
    name: "Gate 3 — schema"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install validators
        run: pip install pyyaml jsonschema
      - name: Validate requirements.yaml against req-schema.json
        run: python scripts/verify_schema.py

  static-analysis:
    name: "Gate 2 — static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install the baseline (root layout)
        run: pip install -e . --no-deps
      - name: Lint
        run: ruff check src test scripts
      - name: Type check (project-owned modules, ADR-009)
        run: python -m mypy
      - name: Dependency check
        run: pip check

  safety-paths:
    name: "Gate 2 — safety paths"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Contract / security / API surface / permission checks
        run: python scripts/check_safety_paths.py --quiet

  baseline-integrity:
    name: "ADR-008 — baseline integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Verify the pinned baseline against the declared overrides
        run: python scripts/verify_baseline.py --strict

  test-approval:
    name: "Gate 1 — test approval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install validators
        run: pip install pyyaml
      - name: Every changed test is approved in the base manifest
        run: python scripts/gate_test_approval.py --list

  offline-tests:
    name: "Gate 5 — offline suite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Deterministic offline tests (no API keys)
        run: python -m pytest test/offline -m offline -q

  regression:
    name: "Gate 5 — upstream regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Full prior suite (the pinned baseline own tests)
        run: python -m pytest tests -q -m "not integration"

  semantic-eval:
    name: "Gate 4 — semantic evaluation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Replay the fixed evaluation set
        run: python scripts/gate_semantic_eval.py

  ai-use-log:
    name: "Gate 6 — AI-use log"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Code or prompt change requires an AI-use log update
        run: |
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" || true
          python scripts/gate_ai_use_log.py --list

  gate-summary:
    name: "All blocking gates"
    if: always()
    needs:
      - schema-gate
      - static-analysis
      - safety-paths
      - baseline-integrity
      - test-approval
      - offline-tests
      - regression
      - semantic-eval
      - ai-use-log
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gate failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "failure"|"result":"failure"|"result": "cancelled"|"result":"cancelled"'; then
            echo "::error::A blocking gate failed; the merge is blocked."
            exit 1
          fi
          echo "all blocking gates passed"
