# CS5351 CI/CD — Blocking Gates (D4/D7)
# Implements the six required blocking gates + branch protection policy.
# Every job that fails blocks a merge unless the failure is a documented
# non-blocking path.

name: CS5351 Blocking Gates

on:
  push:
    branches: ["main", "dev", "develop", "feature-c"]
  pull_request:
    branches: ["main", "dev", "develop", "feature-c"]

jobs:
  # ---- Gate 3: Schema gate — validate requirements registry against its schema.
  schema-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install validators
        run: pip install pyyaml jsonschema
      - name: Validate requirements.yaml against req-schema.json
        run: |
          python - <<'PY'
          import json, yaml, jsonschema
          with open("docs/req/req-schema.json", encoding="utf-8") as f:
              schema = json.load(f)
          with open("docs/req/requirements.yaml", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          jsonschema.validate(data, schema)
          print("schema-gate: PASS")
          PY

  # ---- Gate 2: Static analysis — lint, type-check, dependency check.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Lint / type-check / dep check (placeholder)
        run: |
          echo "static-analysis: run ruff, mypy/pyright, pip-audit here"
          # TODO: wire real tooling once deps are declared.

  # ---- Gate 1: Test approval gate + Gate 5: Regression gate.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Install the pinned baseline (root layout or vendor layout)
        run: |
          if [ -d vendor/tradingagents-0.7.x ]; then
            pip install -e vendor/tradingagents-0.7.x --no-deps
          else
            pip install -e . --no-deps
          fi
      - name: Offline / deterministic tests (no API)
        run: pytest test/offline -m offline -q
      - name: Regression — full prior suite
        run: pytest -m "offline" -q   # live tests need keys; offline = deterministic
      # Gate 1 note: assert the PR's tests were approved before impl — enforce
      # via a review requirement on the test files (see branch protection).

  # ---- Gate 6: AI-use log gate — PR changing code/prompts must update the log.
  ai-use-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block if code/prompts changed without ai-use-log.yaml
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/|prompts/)' \
             && ! git diff --name-only HEAD^ HEAD | grep -q '^docs/ai-use-log.yaml'; then
            echo "::error::AI-use log gate: code/prompts changed without updating docs/ai-use-log.yaml"
            exit 1
          fi
          echo "ai-use-log: PASS"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Gate 4 (semantic evaluation) and Gate 1 (test approval via review) are
# intentionally placeholders here — wire them once the implementation exists.
# Branch protection (bypass check) must require these CI checks + human review
# on safety-critical paths. This is a skeleton, not the finished policy.